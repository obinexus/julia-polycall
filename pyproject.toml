# QA descriptor for the Polycall binding matrix (read by polycall/qa/run_qa.py).
# This repository is NOT a Python package and is not pip-installable;
# its native manifest is Project.toml (plus package.json for the npm source package).
[tool.polycall.binding]
name = "julia-polycall"
language = "Julia"
native_manifest = "Project.toml"
registry = "npm"
package = "@obinexusltd/julia-polycall"
abi = 1
support = "supported"
linux_image = "julia:1"
build = ""
test = "JULIA_PKG_OFFLINE=true JULIA_NUM_THREADS=4 julia --project=. -e 'using Pkg; Pkg.test()'"
# PowerShell; POLYCALL_LIBRARY = <prefix>\bin\polycall.dll (MSVC) or libpolycall.dll (UCRT64)
windows_test = "$env:JULIA_PKG_OFFLINE='true'; $env:POLYCALL_CLI='<prefix>\\bin\\polycall.exe'; julia -t 4 --project=. -e 'using Pkg; Pkg.test()'"
